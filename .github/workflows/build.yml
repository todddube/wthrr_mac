name: Build & Package DMG

on:
  push:
    tags:
      - 'v*'          # triggers on v1.0, v1.1, etc.
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  build:
    name: Build DMG
    runs-on: macos-15
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: wthrr-dmg
          path: build/*.dmg
          retention-days: 30

      # Creates a GitHub Release with the DMG attached (on version tags only).
      # Release notes are read from release-notes/<version>.md (strip leading 'v').
      - name: Resolve release notes path
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="release-notes/${VERSION}.md"
          if [[ -f "$NOTES" ]]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Warning: no release notes found at $NOTES — falling back to auto-generated notes."
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          draft: false
